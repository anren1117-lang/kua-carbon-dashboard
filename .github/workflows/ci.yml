name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (Vite)
    # PINNED to the image the green runs actually used (Runner Image:
    # ubuntu-24.04). `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19,
    # and an unpinned runtime is what put this repo on end-of-life Node 20
    # for six months (Phase 526). Same lesson, one layer down.
    #
    # A commitment to revisit, not to sit on 24.04 forever: bump it
    # deliberately and watch CI, rather than being bumped by a calendar.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # FROM .nvmrc, which is the one recorded version for this project.
          #
          # This said `node-version: 20`. Node 20 reached end of life on
          # 2026-04-30, so CI was building and testing the dashboard on an
          # unsupported runtime for ~6 months — and on a different major from
          # every local run (this project develops on 24.x), which also meant
          # a different bundled npm: CI resolved with npm 10.x against a
          # lockfile written by npm 11.x.
          #
          # Node 24 is LTS until 2028-04-30 and is what local already runs, so
          # aligning on it fixes the EOL problem and the local/CI split at
          # once. src/package.json records the same floor in `engines`.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        run: npm ci

      - name: NUL byte guard
        # Scans every tracked source file (.js/.ts/.html/.css/.md/.sql/...)
        # for literal 0x00 bytes. Fails CI if any are found — see commit
        # cd2f26a for the original incident.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-no-nul-bytes.mjs

      - name: Vitest
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Bundle-size guardrail
        # Was four lines of inline bash, which meant the check lived only on
        # the runner and no local command could run it. Now the same script
        # backs both this step and `npm run verify`, so local and CI cannot
        # drift. It also rejects a missing or ambiguous bundle rather than
        # measuring whichever file `ls` happened to sort first.
        run: npm run check:bundle
